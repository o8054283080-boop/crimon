name: 検査

# 型・テスト・巡回をPRで自動的に通す。
#
# **巡回はこの案件で唯一の安全網**で、はみ出し・押せないボタン・小さすぎる文字を拾う。
# 型チェックとテストはCSSの崩れを1件も拾わないので、これが無いと素通りする。
#
# 今まで巡回は「人が最後に手で流す」ものだった。実際にそれで漏れた:
# ホームの作り替えで巡回の目印が外れ、28画面のうち22画面が検査されないまま、
# 押せないボタンが複数そのままmainへ入った。**記憶に頼らせない。**

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types-and-tests:
    name: 型とテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: テスト
        run: npm test
      - name: ビルド
        run: npm run build
      - name: 差分の空白検査
        run: |
          git diff --check
          git diff --check origin/main...HEAD
      - name: モンスターのデータ検診
        run: npx tsx tools/monsterDoctor.mts

      # サーバ側の検分に使う定義表は、ゲームのデータから生成している。
      # **データを触って生成し直すのを忘れると、検分が古い定義で動く。**
      # 図鑑を1体足しただけで、その1体を使う人が防衛を登録できなくなる。
      - name: アリーナの照合表が最新か
        run: npm run arena:catalog -- --check

      # Edge Function はクライアントと**同じ戦闘エンジン**を使う。
      # 組み立てられないと、勝敗を決める場所が動かない。
      # ここで落としておかないと、気づくのは本番へ配った後になる。
      - name: Edge Function 向けの組み立て
        run: npm run build:edge

  tour:
    name: 巡回(画面の崩れ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # 目印の数を先に見る。**巡回が画面へ辿り着けなくなる壊れ方**は、
      # 巡回自身の「移動できない」としてしか現れず、見落としやすい。
      # 減った時点で、はっきり落とす。
      - name: 巡回の目印が残っているか
        run: |
          COUNT=$(grep -ro 'data-tour' src/web/ | wc -l)
          echo "data-tour の目印: $COUNT 箇所"
          if [ "$COUNT" -lt 8 ]; then
            echo "::error::巡回の目印が減っています。画面を作り替えた時は data-tour を新しいボタンへ引き継いでください(AGENTS.md 参照)"
            exit 1
          fi

      # 常駐サーバの起動と巡回は**同じステップで行う**。
      #
      # 別ステップで `&` を付けて起こしたら、そのステップが終わらなくなった。
      # runner はステップの標準出力が閉じるまで待つので、繋いだままの
      # バックグラウンドのプロセスがいると、そこで止まり続ける。
      # `nohup` と `< /dev/null` で入出力を切り離し、1ステップに畳む。
      #
      # 撮影も同じステップに置く。ここで撮らないと、失敗した時の絵が残らない。
      - name: 全画面を巡回する
        timeout-minutes: 12
        env:
          HARNESS_PORT: "5391"
        run: |
          HARNESS_VITE_PORT=5390 HARNESS_PORT=5391 \
            nohup node tools/harness.mjs > harness.log 2>&1 < /dev/null &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5391/health >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:5391/health >/dev/null 2>&1; then
            echo "::error::常駐サーバが起きてこない"
            cat harness.log
            exit 1
          fi
          # **成功しても撮る。**
          #
          # 以前は落ちた時だけ撮っていたが、それでは「通ったから見なくていい」に
          # なってしまう。巡回が拾えるのは、はみ出し・押せない・小さすぎる文字だけで、
          # 「読めるが格好悪い」は数字にならない。**目で見るための絵を毎回残す。**
          node tools/tour.mjs --shots artifacts/tour
          # 今回追加した3一覧を、通常/簡易・iPhone 2サイズで個別に残す。
          # scene は同じ保存データを毎回差し込むため、列数と選択素材数を再現できる。
          for SIZE in 縦 縦大; do
            DIMS=$([ "$SIZE" = "縦" ] && echo "390x844" || echo "430x932")
            for VIEW in normal dense; do
              DENSE_FLAG=$([ "$VIEW" = "dense" ] && echo "--dense" || echo "")
              node tools/scene.mts monsters --state mid --size "$SIZE" $DENSE_FLAG --shot "artifacts/tour/${DIMS}-モンスター-${VIEW}.png"
              node tools/scene.mts training --state mid --size "$SIZE" $DENSE_FLAG --shot "artifacts/tour/${DIMS}-強化素材-${VIEW}.png"
              node tools/scene.mts rankup --state mid --size "$SIZE" $DENSE_FLAG --shot "artifacts/tour/${DIMS}-ランクアップ素材-${VIEW}.png"
            done
          done

      - uses: actions/upload-artifact@v4
        # 通った時こそ見たいので always()。落ちた時は原因の絵が要る
        if: always()
        with:
          name: tour-${{ github.event.pull_request.number || github.run_id }}
          path: artifacts/tour/*.png
          if-no-files-found: ignore
          retention-days: 7
