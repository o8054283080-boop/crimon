name: アリーナ精算Edge Functionを本番へ同期

# 精算の Edge Function(`arena-settle`)は、**戦闘エンジンとモンスター定義を
# `_shared` へ同梱して動く。**新しいモンスターや戦闘の直しが main へ入っても
# ここを流し直さないと、クライアントでは決着しているのにサーバ側の再戦闘が失敗し、
# 対戦が OPEN のまま残る。**挑戦券だけ減って、レートもコインも入らない。**
#
# 照合表(`arena-catalog.yml`)と同じで、**押し忘れが事故になる形**だった。
# だから押さずに流れるようにする。精算へ影響するものが main へ入ったら
# `build:edge` → `arena-settle` の deploy までを自動で通す。
#
# Secrets に `SUPABASE_ACCESS_TOKEN` が要る。
# 接続先(project ref)は公開設定の `.env.production` から取るので二重管理しない。

on:
  push:
    branches: [main]
    paths:
      - "src/core/**"
      - "src/data/**"
      - "src/game/arena/**"
      - "src/battle/**"
      - "supabase/functions/arena-settle/**"
      - "scripts/build-edge.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/arena-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arena-settle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: buildして本番へdeploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 依存関係を入れる
        run: npm ci
      - name: Edge Function共有コードを最新化
        run: npm run build:edge
      - name: Supabase project refを取得
        run: |
          set -euo pipefail
          url="$(grep -E '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2- | tr -d '"[:space:]')"
          ref="$(printf '%s' "$url" | sed -E 's#^https?://##' | cut -d. -f1)"
          if ! printf '%s' "$ref" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error::Supabase project ref の抽出に失敗しました: $ref"
            exit 1
          fi
          echo "SUPABASE_PROJECT_REF=$ref" >> "$GITHUB_ENV"
      - name: arena-settleをdeploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN が未登録です"
            exit 1
          fi
          npx supabase functions deploy arena-settle --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: deploy済みFunctionを確認
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
