name: アリーナ精算Edge Functionを本番へ同期

# arena-settle は戦闘エンジン・モンスター定義を _shared に同梱して動く。
# 新モンスターや戦闘処理だけ main に入って Edge Function を再deployしないと、
# クライアントでは戦闘終了してもサーバ再戦闘が失敗し、対戦セッションが OPEN のまま残る。
# その結果、挑戦券だけ消費してレート/コインが反映されない。
#
# 人の手での deploy 忘れを防ぐため、アリーナ精算へ影響するソースが main に入ったら
# build:edge → arena-settle deploy を自動実行する。
#
# GitHub Actions secrets に SUPABASE_ACCESS_TOKEN が必要。
# project ref は公開設定 .env.production から取得するので二重管理しない。

on:
  push:
    branches: [main]
    paths:
      - "src/core/**"
      - "src/data/**"
      - "src/game/arena/**"
      - "src/battle/**"
      - "supabase/functions/arena-settle/**"
      - "scripts/build-edge.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/arena-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arena-settle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: buildして本番へdeploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係を入れる
        run: npm ci

      - name: Edge Function共有コードを最新化
        run: npm run build:edge

      - name: Supabase project refを取得
        run: |
          set -euo pipefail
          url="$(grep -E '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)"
          ref="$(printf '%s' "$url" | sed -E 's#^https?://([^.]+)\\..*#\\1#')"
          test -n "$ref"
          echo "SUPABASE_PROJECT_REF=$ref" >> "$GITHUB_ENV"

      - name: arena-settleをdeploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN が未登録です"
            exit 1
          fi
          npx supabase functions deploy arena-settle \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api

      - name: deploy済みFunctionを確認
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
