name: 70階咆哮重複修正

on:
  push:
    branches:
      - claude/tower-70-progenitor-behemoth-lab

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/tower-70-progenitor-behemoth-lab
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/applyTower70Polish.mjs
      - run: |
          rm tools/applyTower70Polish.mjs
          rm .github/workflows/tower70-polish.yml
          git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/battle/engine.ts tools/applyTower70Polish.mjs .github/workflows/tower70-polish.yml
          git commit -m "70階咆哮の防御低下を重複せず更新"
          git push origin HEAD:claude/tower-70-progenitor-behemoth-lab
