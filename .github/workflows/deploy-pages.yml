name: Deploy to GitHub Pages

# 公開は main からだけ行う。
#
# 以前は作業ブランチでも動かしていたが、**作業ブランチからの公開は必ず失敗する**
# (ビルドは通るのに deploy が1秒で落ちる。Pages の環境が既定ブランチ以外からの
# 公開を許していないため)。さらに下の concurrency で枠を取り合うので、
# ブランチへ push した直後に main へマージすると**main側がキャンセルされ**、
# 結果として公開中のページだけが古いまま取り残されていた。
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 同じ枠に入った実行は待たせる。**途中で打ち切らない。**
# 打ち切ると、最後に流した内容が公開されないまま終わることがある。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
