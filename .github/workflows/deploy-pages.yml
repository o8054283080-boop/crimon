name: Deploy to GitHub Pages

# 公開は main からだけ行う。
#
# 以前は作業ブランチでも動かしていたが、**作業ブランチからの公開は必ず失敗する**
# (ビルドは通るのに deploy が1秒で落ちる。Pages の環境が既定ブランチ以外からの
# 公開を許していないため)。さらに下の concurrency で枠を取り合うので、
# ブランチへ push した直後に main へマージすると**main側がキャンセルされ**、
# 結果として公開中のページだけが古いまま取り残されていた。
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 同じ枠に入った実行は待たせる。**途中で打ち切らない。**
# 打ち切ると、最後に流した内容が公開されないまま終わることがある。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # iOS 18.7.8 の実機で OGG/Vorbis が Web Audio の decodeAudioData() では
      # EncodingError、HTMLAudioElement でも「再生中」に見えるのに無音になる端末を確認した。
      # 公開物だけは互換性の高い AAC/M4A へ変換し、manifest も M4A を指すようにする。
      # 元のOGGはリポジトリに残すので、音作りのソースや再生成手順は変えない。
      - name: iPhone互換のAAC音源を用意
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          for src in public/audio/*.ogg; do
            dst="${src%.ogg}.m4a"
            ffmpeg -hide_banner -loglevel error -y -i "$src" -c:a aac -b:a 160k -movflags +faststart "$dst"
          done
          python - <<'PY'
          from pathlib import Path
          p = Path("public/audio/manifest.json")
          text = p.read_text(encoding="utf-8")
          p.write_text(text.replace('.ogg"', '.m4a"'), encoding="utf-8")
          PY
          test -s public/audio/bgm_home.m4a
          test -s public/audio/tap_0.m4a
          grep -q 'bgm_home.m4a' public/audio/manifest.json
      # **アリーナのオンライン機能は、ここで環境変数を渡さないと永久に動かない。**
      #
      # Vite は `VITE_` で始まる環境変数を**組み立ての時に**中へ焼き込む。
      # 渡さないまま配ると、`arenaSyncAvailable()` がずっと false になり、
      # ランキングは「ローカル(この端末の中だけ)」のままになる。
      # 表・RPC・Edge Function をどれだけ整えても、そこへ繋ぎに行かない。
      #
      # anon key は**ブラウザへ配る前提の鍵**なので、リポジトリ変数でよい
      # (秘密として置きたい場合のために secrets も見る)。
      # **`service_role` は絶対にここへ書かない。**
      # 未設定なら今までどおりオフラインで組み上がる——落ちはしない。
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
