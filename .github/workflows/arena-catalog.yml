name: アリーナ照合表を本番へ流す

# 照合表を本番のSupabaseへ入れる。
#
# **作り直しても、流すまでは効かない。**
# `npm run arena:catalog` が作るのは `supabase/migrations/` のファイルだけで、
# CIも「手元の定義と揃っているか」しか見ていない。
#
# ## 流し忘れで、同じ事故を2回出している
#
# 1回目。メインのクリダメを1.35倍にした時、★6+15 の上限は 0.948 → 1.274 へ
# 動いたのに本番の表は古いまま。クリダメメインの★6装備を着けている人は全員
# `MAIN_STAT_OVER_CAP` で弾かれ、**防衛の登録も、対戦の発行も落ちていた。**
# しかもそれは画面に「挑戦券が減らない」としてしか現れなかった。
#
# 2回目。コラボ4種(全24体)を足して照合表も作り直したのに、
# **押す作業が抜けていた。**本番の表は24体ぶん足りないまま
# (図鑑 217件 / 手元 241件)、コラボのモンスターを編成へ入れた人は
# `UNKNOWN_DEX_ID` で**アリーナに一度も入れなかった。**
# プレイヤーからの報告で分かった。
#
# ## だから、押さなくても流れるようにした
#
# `main` に**新しい `arena_catalog_*.sql` が入った時**は自動で流す。
# 照合表は `delete` → `insert` の入れ替えなので、余分に走っても結果は同じ。
# 手で押す道(`workflow_dispatch`)は、本番の値を見たい時のために残してある。
#
# **モンスターを足す変更は、これで必ず本番へ届く。**
# 届かせるのを人の記憶に任せない——2回とも、そこで落ちている。
#
# 照合表は `delete` してから `insert` する作りなので、**何度流しても同じ結果**になる。
# 流す時は `--single-transaction` で囲む。途中で落ちて表が空になると、
# `CATALOG_MISSING` で全員がアリーナに入れなくなるため。
#
# ## 使うのに要るもの
#
# リポジトリの Settings → Secrets and variables → Actions に、
# `SUPABASE_DB_PASSWORD` を1つだけ登録する
# (Supabase の Settings → Database → Database password)。
# **`service_role` の鍵ではない。**あれはここでは使わないし、置いてもいけない。
#
# **接続文字列(URI)を丸ごと入れる形にはしない。**
# 最初はそうしていて、認証で弾かれた。パスワードに `@` `#` `?` `/` `%` が
# 1文字でも混ざると、URLとしての切れ目がずれてパスワードが途中で切れる。
# しかも出るのは `password authentication failed` だけで、
# **パスワードが違うのか、文字列が壊れたのかが区別できない。**
# 接続先は `.env.production` から組み立て、パスワードは `PGPASSWORD` で渡す。
# こうすると、どんな記号が入っていてもそのまま通る。
#
# 接続先のホストは既定で東京の Session pooler。別のリージョンなら
# `SUPABASE_DB_HOST` を足すと、そちらが使われる
# (Supabase の Connect → Direct → Session pooler に出ているホスト名)。

on:
  # **生成物が main へ入ったら、押さなくても流す。**
  # ここを手動だけにしていたせいで、2回とも押し忘れてアリーナが壊れた。
  # `paths` を絞ってあるので、照合表に関係のない push では走らない。
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/*arena_catalog*.sql"
  # 手で押す道も残す。`dry_run` で、流さずに本番の値だけを見られる
  workflow_dispatch:
    inputs:
      dry_run:
        description: "流さずに、いまの本番の値だけを見る"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 同時に2本流すと、片方の delete ともう片方の insert が噛み合って表が壊れる
  group: arena-catalog-apply
  cancel-in-progress: false

jobs:
  apply:
    name: 照合表を流す
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 流すファイルを決める
        id: pick
        run: |
          set -euo pipefail
          # 生成物は日付つきの名前で増えていく。**いちばん新しい1本だけ**でよい
          # (中身は全テーブルの入れ替えなので、過去のぶんを含んでいる)
          file="$(ls -1 supabase/migrations/*arena_catalog*.sql | sort | tail -1)"
          if [ -z "$file" ]; then
            echo "照合表の生成物が見つかりません" >&2
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "流すファイル: $file"

      - name: 手元の生成物が最新か確かめる
        # **古い生成物を本番へ入れない。**定義を触って作り直し忘れていたら、
        # ここで止まる(`arena:catalog --check` がCIと同じ検査をする)
        run: |
          npm ci
          npm run arena:catalog -- --check

      - name: 接続先を組み立てる
        env:
          # ホストの上書き。登録が無ければ既定(東京の Session pooler)を使う
          HOST_OVERRIDE: ${{ secrets.SUPABASE_DB_HOST }}
        run: |
          set -euo pipefail
          # プロジェクトの識別子は `.env.production` にある。**2か所に置かない**
          url="$(grep -E '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)"
          ref="$(printf '%s' "$url" | sed -E 's#^https?://([^.]+)\..*#\1#')"
          if [ -z "$ref" ]; then
            echo ".env.production から Supabase の識別子を読めませんでした" >&2
            exit 1
          fi
          host="${HOST_OVERRIDE:-aws-0-ap-northeast-1.pooler.supabase.com}"
          {
            echo "PGHOST=$host"
            echo "PGPORT=5432"
            # Session pooler は識別子つきの利用者名を要る。**ここを `postgres` だけにすると弾かれる**
            echo "PGUSER=postgres.$ref"
            echo "PGDATABASE=postgres"
          } >> "$GITHUB_ENV"
          echo "接続先: $host / postgres.$ref"

      - name: 接続を確かめる
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PGPASSWORD:-}" ]; then
            echo "SUPABASE_DB_PASSWORD が登録されていません。" >&2
            echo "Settings → Secrets and variables → Actions で追加してください。" >&2
            echo "値は Supabase の Settings → Database → Database password です。" >&2
            exit 1
          fi
          # **弾かれた時に何を直せばいいかを出す。**
          # psql が返すのは `password authentication failed` だけで、
          # パスワードが違うのか接続先が違うのかが読み取れない
          if ! psql -v ON_ERROR_STOP=1 -t -A -c "select 'つながりました: ' || current_database();"; then
            echo "::error::接続できませんでした。$PGHOST / $PGUSER で試しています。" >&2
            echo "パスワードが違う場合は、Supabase の Settings → Database → Reset database password で" >&2
            echo "作り直してから、SUPABASE_DB_PASSWORD を入れ直してください。" >&2
            echo "リージョンが東京でない場合は、SUPABASE_DB_HOST に pooler のホスト名を登録してください。" >&2
            exit 1
          fi

      - name: いまの本番の値
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "
            select stat_type, star, level, main_max
              from public.arena_catalog_stat_caps
             where (stat_type, star, level) in (('CRIT_DMG', 6, 15), ('HP_PERCENT', 6, 15))
             order by stat_type;"
          psql -v ON_ERROR_STOP=1 -t -A -c "
            select '図鑑の件数: ' || count(*) from public.arena_catalog_monsters;"

      - name: 流す
        # push で来た時に `inputs` は空になる。**空を「見るだけ」と読ませない**
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # **途中で落ちたら全部戻す。**表が空のまま残るのがいちばん困る
          psql -v ON_ERROR_STOP=1 --single-transaction -f "${{ steps.pick.outputs.file }}"

      - name: 入ったか確かめる
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "
            select stat_type, star, level, main_max
              from public.arena_catalog_stat_caps
             where (stat_type, star, level) in (('CRIT_DMG', 6, 15), ('HP_PERCENT', 6, 15))
             order by stat_type;"
          psql -v ON_ERROR_STOP=1 -t -A -c "
            select '図鑑の件数: ' || count(*) from public.arena_catalog_monsters;"

          # **手元の生成物と突き合わせる。**流したつもりで入っていない、を防ぐ
          want="$(grep -oE "\('CRIT_DMG', 6, 15, [0-9.]+" "${{ steps.pick.outputs.file }}" \
                  | head -1 | grep -oE "[0-9.]+$")"
          got="$(psql -v ON_ERROR_STOP=1 -t -A -c "
            select main_max from public.arena_catalog_stat_caps
             where stat_type = 'CRIT_DMG' and star = 6 and level = 15;")"
          echo "装備の上限: 手元 $want / 本番 $got"
          if [ "$(printf '%s' "$want" | sed 's/0*$//')" != "$(printf '%s' "$got" | sed 's/0*$//')" ]; then
            echo "本番の値が生成物と合っていません" >&2
            exit 1
          fi

          # **図鑑の件数も突き合わせる。**
          # ここまでは装備の上限しか見ていなかった。上限が合っていても
          # モンスターが足りなければ、その種族を編成へ入れた人は
          # `UNKNOWN_DEX_ID` でアリーナに入れない——実際にそれで
          # コラボ4種(24体)を落とし、プレイヤーからの報告で気づいた。
          want_dex="$(grep -oE '^-- 図鑑 [0-9]+ 件' "${{ steps.pick.outputs.file }}" \
                      | head -1 | grep -oE '[0-9]+')"
          got_dex="$(psql -v ON_ERROR_STOP=1 -t -A -c "
            select count(*) from public.arena_catalog_monsters;")"
          echo "図鑑の件数: 手元 $want_dex / 本番 $got_dex"
          if [ -z "$want_dex" ] || [ "$want_dex" != "$got_dex" ]; then
            echo "本番の図鑑の件数が生成物と合っていません" >&2
            exit 1
          fi
          echo "照合表は最新です"
