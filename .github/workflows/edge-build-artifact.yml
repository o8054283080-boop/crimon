name: Edge build artifact
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:edge
      - uses: actions/upload-artifact@v4
        with:
          name: arena-edge-${{ github.sha }}
          path: |
            supabase/functions/arena-settle/index.ts
            supabase/functions/_shared/**/*.js
          retention-days: 3
      - name: Commit exact generated Edge bundle for production sync
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f supabase/functions/_shared
          git diff --cached --quiet && exit 0
          git commit -m "build: stage exact arena edge bundle"
          git push origin HEAD:${{ github.ref_name }}
