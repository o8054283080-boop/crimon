name: Edge build artifact
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:edge
      - uses: actions/upload-artifact@v4
        with:
          name: arena-edge-${{ github.sha }}
          path: |
            supabase/functions/arena-settle/index.ts
            supabase/functions/_shared/**/*.js
          retention-days: 3
      - name: Pack Edge bundle for deployment
        run: |
          node - <<'NODE'
          const fs=require('fs'), path=require('path');
          const root='supabase/functions'; const out=[];
          function walk(d){for(const n of fs.readdirSync(d)){const p=path.join(d,n);const s=fs.statSync(p);if(s.isDirectory())walk(p);else if(p.endsWith('.js'))out.push({name:p.slice(root.length+1),content:fs.readFileSync(p,'utf8')});}}
          walk(root+'/_shared');
          out.push({name:'arena-settle/index.ts',content:fs.readFileSync(root+'/arena-settle/index.ts','utf8')});
          fs.writeFileSync(root+'/arena-edge-bundle.json',JSON.stringify(out));
          NODE

      - name: Commit exact generated Edge bundle for production sync
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f supabase/functions/_shared supabase/functions/arena-edge-bundle.json
          git diff --cached --quiet && exit 0
          git commit -m "build: stage exact arena edge bundle"
          git push origin HEAD:${{ github.ref_name }}
