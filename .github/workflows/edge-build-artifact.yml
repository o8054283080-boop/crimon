name: Edge build artifact
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:edge
      - uses: actions/upload-artifact@v4
        with:
          name: arena-edge-${{ github.sha }}
          path: |
            supabase/functions/arena-settle/index.ts
            supabase/functions/_shared/**/*.js
          retention-days: 3
