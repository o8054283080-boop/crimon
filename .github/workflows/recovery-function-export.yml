name: 復旧APIの中身を取り出す

# `crimon-recovery` は**リポジトリに無い。**Supabase 上へ直接置かれている。
# そのせいで**セッションの寿命が何分なのか、手元からは分からない**——
# 期限切れで自動バックアップが黙って止まる不具合を追うのに、これが要る。
#
# 取り出したらリポジトリへ置き、`arena-settle` と同じ自動deployに載せる。
# **載せ終えたらこのワークフローは消す**(取り出しは一度きりで足りる)。
#
# ## このリポジトリは公開されている
#
# ログも誰でも読める。**秘密が混ざっていないかを先に検査して、
# 見つかったら中身を出さずに落とす。**当てるのは値の形だけ——
# 変数名に当てると `Deno.env.get("...")` という正しい書き方で止まる(前に止めた)。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: ソースを取り出す
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 依存関係を入れる
        run: npm ci
      - name: Supabase project refを取得
        run: |
          set -euo pipefail
          url="$(grep -E '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2- | tr -d '"[:space:]')"
          ref="$(printf '%s' "$url" | sed -E 's#^https?://##' | cut -d. -f1)"
          if ! printf '%s' "$ref" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error::Supabase project ref の抽出に失敗しました: $ref"
            exit 1
          fi
          echo "SUPABASE_PROJECT_REF=$ref" >> "$GITHUB_ENV"
      - name: 関数を取り出す
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN が未登録です"
            exit 1
          fi
          npx supabase functions download crimon-recovery --project-ref "$SUPABASE_PROJECT_REF"
      - name: 秘密が混ざっていないか検める
        run: |
          set -euo pipefail
          target="supabase/functions/crimon-recovery"
          if [ ! -d "$target" ]; then
            echo "::error::取り出せていません: $target が無い"
            exit 1
          fi
          hits="$(grep -rEn "eyJ[A-Za-z0-9_-]{30,}|sb_secret_[A-Za-z0-9_-]{10,}|['\"][A-Za-z0-9+/]{60,}={0,2}['\"]" "$target" || true)"
          if [ -n "$hits" ]; then
            echo "$hits" | sed -E 's/:.*/: (中身は伏せます)/'
            echo "::error::秘密らしき値が見つかりました。ログへは出しません"
            exit 1
          fi
          echo "秘密らしき値は見つかりませんでした"
      - name: 中身をログへ出す
        run: |
          set -euo pipefail
          find supabase/functions/crimon-recovery -type f | sort | while read -r file; do
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done
