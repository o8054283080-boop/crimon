name: Rescue final HOME patch
on:
  push:
    branches:
      - rescue/crimon-home-final
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue/crimon-home-final
          fetch-depth: 0
      - name: Apply recovered Codex patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/crimon-home-final.patch.b64 | gzip -d > /tmp/crimon-home-final.patch
          test "$(wc -c < /tmp/crimon-home-final.patch)" -eq 35351
          grep -q '^From ff5fef91aa5510975babc144901b8a1ad865f7a8 ' /tmp/crimon-home-final.patch
          git fetch origin main
          git rm -rf .
          git checkout origin/main -- .
          git apply --check /tmp/crimon-home-final.patch
          git apply /tmp/crimon-home-final.patch
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only d4054c57d6e4016d07d1fd89d233b69628c700a5 | wc -l)" -eq 15
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: complete CRIMON dark fantasy HOME lobby"
          git push origin HEAD:rescue/crimon-home-final
