name: 70階確定差分適用

on:
  push:
    branches:
      - claude/tower-70-progenitor-behemoth-lab

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/tower-70-progenitor-behemoth-lab
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 確定差分を適用
        run: node tools/applyTower70Final.mjs
      - name: 一時ファイルを削除
        run: |
          rm tools/applyTower70Final.mjs
          rm .github/workflows/tower70-finalize.yml
      - name: 差分確認
        run: |
          git diff --check
          git diff -- src/battle/engine.ts src/data/trialTower.ts tools/battleLab/tower70/RESULT-v3.md
      - name: コミットして同じPRブランチへ反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/battle/engine.ts src/data/trialTower.ts tools/battleLab/tower70/RESULT-v3.md tools/applyTower70Final.mjs .github/workflows/tower70-finalize.yml
          git commit -m "試練の塔70階を確定仕様で本編実装"
          git push origin HEAD:claude/tower-70-progenitor-behemoth-lab
