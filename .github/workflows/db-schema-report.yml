name: 本番のテーブル定義を調べる

# アリーナのアカウントが2つに分かれた件を追うのに、**どのテーブルが
# `user_id` を持っているか**を知る必要がある。片方でも漏らすと、
# 統合した時に**成績やコインが置き去りになる。**
#
# ここは**定義だけを読む。**データは1行も出さない(ログは誰でも読める)。
# 調べ終わったらこのワークフローは消す。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: 定義を読む
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: psql を入れる
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: 接続先を組み立てる
        env:
          HOST_OVERRIDE: ${{ secrets.SUPABASE_DB_HOST }}
        run: |
          set -euo pipefail
          url="$(grep -E '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)"
          ref="$(printf '%s' "$url" | sed -E 's#^https?://([^.]+)\..*#\1#')"
          if [ -z "$ref" ]; then
            echo ".env.production から Supabase の識別子を読めませんでした" >&2
            exit 1
          fi
          host="${HOST_OVERRIDE:-aws-0-ap-northeast-1.pooler.supabase.com}"
          {
            echo "PGHOST=$host"
            echo "PGPORT=5432"
            echo "PGUSER=postgres.$ref"
            echo "PGDATABASE=postgres"
          } >> "$GITHUB_ENV"
      - name: user_id を持つ表と、その列を出す
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PGPASSWORD:-}" ]; then
            echo "SUPABASE_DB_PASSWORD が登録されていません。" >&2
            exit 1
          fi
          echo "::group::public の表と列(定義だけ)"
          psql -v ON_ERROR_STOP=1 -c "
            select table_name, column_name, data_type, is_nullable
            from information_schema.columns
            where table_schema = 'public'
            order by table_name, ordinal_position;
          "
          echo "::endgroup::"
          echo "::group::主キーと一意制約"
          psql -v ON_ERROR_STOP=1 -c "
            select tc.table_name, tc.constraint_type, tc.constraint_name,
                   string_agg(kcu.column_name, ',' order by kcu.ordinal_position) as cols
            from information_schema.table_constraints tc
            join information_schema.key_column_usage kcu on kcu.constraint_name = tc.constraint_name
            where tc.table_schema = 'public' and tc.constraint_type in ('PRIMARY KEY','UNIQUE')
            group by 1,2,3 order by 1,2;
          "
          echo "::endgroup::"
          echo "::group::外部キー(どこが誰を指しているか)"
          psql -v ON_ERROR_STOP=1 -c "
            select tc.table_name as child, kcu.column_name as child_col,
                   ccu.table_name as parent, ccu.column_name as parent_col,
                   rc.delete_rule
            from information_schema.table_constraints tc
            join information_schema.key_column_usage kcu on kcu.constraint_name = tc.constraint_name
            join information_schema.constraint_column_usage ccu on ccu.constraint_name = tc.constraint_name
            join information_schema.referential_constraints rc on rc.constraint_name = tc.constraint_name
            where tc.table_schema = 'public' and tc.constraint_type = 'FOREIGN KEY'
            order by 1,2;
          "
          echo "::endgroup::"
          echo "::group::関数の名前(中身は出さない)"
          psql -v ON_ERROR_STOP=1 -c "
            select p.proname, pg_get_function_identity_arguments(p.oid) as args
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public' order by 1;
          "
          echo "::endgroup::"
