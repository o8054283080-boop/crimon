name: 管理APIのEdge Functionを本番へ同期

# 管理API(`crimon-admin`)は、長いあいだ**リポジトリに無かった。**
# Supabase の画面から直接貼って動かしていたので、
#
#   - 手元から中身が読めず、**管理者画面に項目を足せない**
#     (サーバが返していないものは画面に出しようがない)
#   - 誰がいつ何を変えたのか、履歴がどこにも残らない
#   - 直すたびに画面を開いて貼る——**押し忘れがそのまま事故になる**
#
# 取り出してリポジトリへ置いたので、`arena-settle` と同じ形にする。
# **main へ入れば押さずに流れる。**以降、Supabase の画面から直接編集しないこと
# (そちらで直すと、次に main が動いた時に上書きされて消える)。
#
# Secrets に `SUPABASE_ACCESS_TOKEN` が要る。
# 接続先(project ref)は公開設定の `.env.production` から取るので二重管理しない。

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/crimon-admin/**"
      - ".github/workflows/admin-edge.yml"
      - "supabase/config.toml"
      - "supabase/migrations/20260924223000_player_admin_snapshots.sql"
      - ".github/workflows/db-apply-sql.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crimon-admin-deploy
  cancel-in-progress: false

jobs:
  database:
    uses: ./.github/workflows/db-apply-sql.yml
    with:
      file: supabase/migrations/20260924223000_player_admin_snapshots.sql
    secrets: inherit
  deploy:
    needs: database
    name: 本番へdeploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 依存関係を入れる
        run: npm ci
      - name: Supabase project refを取得
        run: |
          set -euo pipefail
          url="$(grep -E '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2- | tr -d '"[:space:]')"
          ref="$(printf '%s' "$url" | sed -E 's#^https?://##' | cut -d. -f1)"
          if ! printf '%s' "$ref" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error::Supabase project ref の抽出に失敗しました: $ref"
            exit 1
          fi
          echo "SUPABASE_PROJECT_REF=$ref" >> "$GITHUB_ENV"
      - name: crimon-adminをdeploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN が未登録です"
            exit 1
          fi
          npx supabase functions deploy crimon-admin --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: deploy済みFunctionを確認
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
