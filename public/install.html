<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Crimon Cloud</title>
    <meta name="theme-color" content="#171826" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #171826; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100svh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); text-align: center; }
      h1 { margin: 0 0 16px; font-size: 28px; }
      p { margin: 8px 0; line-height: 1.7; color: #d8d9e6; }
      a { display: inline-block; margin-top: 18px; padding: 12px 18px; border-radius: 12px; background: #fff; color: #171826; text-decoration: none; font-weight: 700; }
      .small { margin-top: 18px; font-size: 12px; color: #9fa3b8; }
    </style>
    <script>
      (() => {
        const standalone =
          window.matchMedia?.('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;
        if (standalone) {
          window.location.replace('./');
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Crimon</h1>
      <p>iPhoneのホーム画面追加専用ページです。</p>
      <p>Safariの共有メニューから「ホーム画面に追加」を選び、「Webアプリとして開く」をオンにして追加してください。</p>
      <a href="./">Crimonを開く</a>
      <p class="small">このページはゲームデータを変更しません。</p>
    </main>
  </body>
</html>
