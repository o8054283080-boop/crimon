<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>CRIMON PWA復旧</title>
  <style>
    html,body{margin:0;min-height:100%;background:#171826;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 32px) 20px 40px}h1{font-size:24px}p{line-height:1.7;color:#ddd}button{width:100%;padding:16px;border:0;border-radius:12px;font-size:17px;font-weight:700;background:#fff;color:#171826}#status{margin-top:18px;white-space:pre-wrap}.warn{font-size:14px;color:#f4d58d}
  </style>
</head>
<body>
<main>
  <h1>CRIMON PWA復旧</h1>
  <p>壊れたService Workerとキャッシュだけを削除して、最新版を読み直します。</p>
  <p class="warn">セーブデータ用の localStorage / IndexedDB は削除しません。</p>
  <button id="recover" type="button">PWAを安全に復旧する</button>
  <p id="status">ボタンを押してください。</p>
</main>
<script>
(() => {
  const button = document.getElementById('recover');
  const status = document.getElementById('status');
  button.addEventListener('click', async () => {
    button.disabled = true;
    status.textContent = '復旧しています…';
    try {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }
      if ('caches' in window) {
        const names = await caches.keys();
        await Promise.all(names.map((name) => caches.delete(name)));
      }
      status.textContent = 'キャッシュの復旧が完了しました。最新版を開きます…';
      const base = new URL('./', location.href);
      base.searchParams.set('pwa_recovered', Date.now().toString());
      setTimeout(() => location.replace(base.href), 600);
    } catch (error) {
      console.error(error);
      status.textContent = '自動復旧に失敗しました。セーブデータは削除していません。';
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
